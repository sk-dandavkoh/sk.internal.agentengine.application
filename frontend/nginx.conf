# UI server of the Compose stack (frontend/Dockerfile). Rules explained in
# docs/deployment.md § "The UI".

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker's DNS, re-asked every 10 s: a recreated api container gets a
    # new address, and a name resolved once at startup would then be stale.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        # Host with its port: the live WebSocket accepts the session cookie
        # only when Origin's host:port matches it (ADR 0002).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The backend enforces AKASHA_API_MAX_REQUEST_BYTES with its own
        # error; a second, different limit here would only hide it.
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    # The MCP control plane (docs/mcp.md): 404 from the API unless
    # AKASHA_MCP_ENABLED. Bearer-authenticated JSON over plain POSTs, so no
    # upgrade headers; bodies are capped by the API (AKASHA_MCP_*).
    location = /mcp {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Health, readiness and metrics of the API, which has no port of its
    # own in the Compose stack. /metrics still needs its token.
    location ~ ^/(health|ready|metrics)$ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control no-cache always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
