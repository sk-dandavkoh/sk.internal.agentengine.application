[project]
name = "akasha-engine"
version = "0.1.0"
description = "Self-hosted AI Agent Orchestration Engine — backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "croniter>=6.2.4",
    "cryptography~=46.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "litellm~=1.103.1",
    "prometheus-client~=0.26",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
akasha = "akasha.cli:main"

[dependency-groups]
dev = [
    "pytest~=9.0",
    "ruff~=0.14",
    "mypy~=1.18",
    "hypothesis>=6.168.2",
    "testcontainers[postgres]>=4.10",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akasha"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
src = ["src", "tests", "examples"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; tests hold throwaway test passwords/tokens.
"tests/**" = ["S101", "S105", "S106"]
"examples/**/test_*.py" = ["S101"]
# The CLI's output is its interface: print is the point, not debug residue.
"src/akasha/cli.py" = ["T201"]

[tool.mypy]
mypy_path = "src"
packages = ["akasha"]
strict = true
# Without package bases, two conftest.py files collide as the same module.
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["croniter", "croniter.*"]
ignore_missing_imports = true
