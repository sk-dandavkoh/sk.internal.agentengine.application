# Self-hosted Akasha: UI, API (with the trigger scheduler), a dedicated
# worker, PostgreSQL, Redis and SearXNG (for core.web_search).
# `docker compose up -d --build`, then open http://localhost:8080 and
# create the first admin. No .env is needed:
# secrets are generated on first start. Operator guide: docs/deployment.md.

name: akasha

x-backend: &backend
  image: akasha-backend:${AKASHA_IMAGE_TAG:-0.1.0}
  # Built once, by the migrate service; api and worker run that local image.
  pull_policy: never
  # Optional AKASHA_* tuning (limits, providers, metrics token, ...).
  # AKASHA_ENV_FILE: an alternative file (the deployment test uses one).
  env_file:
    - path: ${AKASHA_ENV_FILE:-.env}
      required: false
  environment:
    AKASHA_REDIS_URL: redis://redis:6379/0
    # Executions run in the worker service, not in the API process.
    AKASHA_WORKER_ENABLED: "false"
    # The bundled SearXNG; set it in .env to use another instance.
    AKASHA_WEB_SEARCH_URL: ${AKASHA_WEB_SEARCH_URL:-http://searxng:8080}
  volumes:
    - plugins:/var/lib/akasha/plugins
    # Per-workflow files of the file nodes and core.command (ADR 0005).
    - workspace:/var/lib/akasha/workspace
    # AKASHA_DATABASE_URL and AKASHA_CREDENTIAL_ENCRYPTION_KEY, read by the
    # backend's settings (backend/src/akasha/config.py).
    - secrets:/run/akasha-secrets:ro
  restart: unless-stopped
  # Above AKASHA_WORKER_SHUTDOWN_GRACE_SECONDS (30): running executions get
  # their grace period before Docker sends SIGKILL.
  stop_grace_period: 60s

services:
  # One-shot: writes the database password and the credential encryption
  # key into the `secrets` volume. Values set in .env win (and are written
  # there, so an existing installation keeps its secrets); otherwise they
  # are generated once and kept. Back the key up: docs/deployment.md §3.
  secrets:
    image: postgres:17.2
    entrypoint: ["sh", "-ceu"]
    command:
      - |
        cd /run/akasha-secrets
        umask 022
        put() {  # put FILE VALUE: atomic, readable by every service
          printf %s "$$2" > "$$1.tmp" && mv "$$1.tmp" "$$1"
        }
        if [ -n "$$POSTGRES_PASSWORD" ]; then
          put postgres_password "$$POSTGRES_PASSWORD"
        elif [ ! -s postgres_password ]; then
          put postgres_password "$$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')"
        fi
        if [ -n "$$AKASHA_CREDENTIAL_ENCRYPTION_KEY" ]; then
          put AKASHA_CREDENTIAL_ENCRYPTION_KEY "$$AKASHA_CREDENTIAL_ENCRYPTION_KEY"
        elif [ ! -s AKASHA_CREDENTIAL_ENCRYPTION_KEY ]; then
          put AKASHA_CREDENTIAL_ENCRYPTION_KEY "$$(head -c 32 /dev/urandom | base64 | tr '+/' '-_')"
        fi
        if [ ! -s searxng_secret ]; then
          put searxng_secret "$$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')"
        fi
        put AKASHA_DATABASE_URL "postgresql://akasha:$$(cat postgres_password)@postgres:5432/akasha"
    environment:
      # Hex or URL-safe: the password goes into a URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      AKASHA_CREDENTIAL_ENCRYPTION_KEY: ${AKASHA_CREDENTIAL_ENCRYPTION_KEY:-}
    volumes:
      - secrets:/run/akasha-secrets
    restart: "no"

  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_USER: akasha
      POSTGRES_DB: akasha
      POSTGRES_PASSWORD_FILE: /run/akasha-secrets/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/run/akasha-secrets:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "akasha", "-d", "akasha"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully

  redis:
    image: redis:8.2.1-alpine
    # The queue survives a Redis restart; lost jobs are also re-dispatched
    # from PostgreSQL (AKASHA_QUEUE_RECOVERY_SECONDS).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Internal only (not published): reachable by the worker as
  # http://searxng:8080. Queries leave the host to the public search
  # engines SearXNG aggregates.
  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555
    entrypoint: ["sh", "-ceu"]
    # Its secret_key is only used for cookies/image proxy signing; it is
    # generated with the other secrets instead of being committed.
    command:
      - |
        SEARXNG_SECRET="$$(cat /run/akasha-secrets/searxng_secret)"
        export SEARXNG_SECRET
        exec /usr/local/searxng/entrypoint.sh
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml
    volumes:
      - secrets:/run/akasha-secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully

  migrate:
    <<: *backend
    build: ./backend
    pull_policy: missing
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["serve"]
    # Not published: the ui service proxies /api, /health, /ready and
    # /metrics to it, so browser and API share one origin and one port.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ui:
    image: akasha-ui:${AKASHA_IMAGE_TAG:-0.1.0}
    build: ./frontend
    pull_policy: missing
    ports:
      # The one entry point: the UI, and the API under /api. Loopback by
      # default: put a TLS reverse proxy in front for remote use.
      - "${AKASHA_BIND_ADDRESS:-127.0.0.1}:${AKASHA_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

configs:
  searxng_settings:
    # core.web_search calls /search?format=json, which SearXNG disables
    # by default.
    content: |
      use_default_settings: true
      search:
        formats: [html, json]
      server:
        limiter: false

volumes:
  pgdata:
  redisdata:
  plugins:
  workspace:
  secrets:
